name: AI Stock Predictor Quantitative - CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run PyTest & Quantitative Factor Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run PyTest Suite
        run: |
          pytest tests/ -v --junitxml=reports/pytest-report.xml

      - name: Verify Alpha Pipeline Import
        run: |
          python -c "import joblib, fpdf, xgboost, ta; print('All Quant dependencies validated successfully')"
